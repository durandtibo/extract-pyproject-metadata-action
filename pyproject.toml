[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/extract_pyproject_metadata"]

[tool.coverage.report]
# The unit tests cover the whole script on every supported Python version.
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]
ignore = [
  "E501", # line length: the code is not reformatted by a tool
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # assert is how pytest tests check
  "S108", # fake /tmp paths in the tests
  "S603", # the tests start the script and run.sh with fixed arguments
  "S607", # ... and a stand-in for python3 found on PATH
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/extract_pyproject_metadata", "scripts/extract_metadata.py"]
mypy_path = "src"
