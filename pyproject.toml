[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
# The unit tests cover the whole script on every supported Python version.
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]
ignore = [
  "E501", # line length: the code is not reformatted by a tool
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # assert is how pytest tests check
  "S108", # fake /tmp paths in the tests
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts/extract_metadata.py"]
