[project]
name = "extract-pyproject-metadata-action"
version = "0.0.0"
requires-python = ">=3.11"
# The repository is not a Python distribution: this table only lets `uv sync` and `pip --group`
# read the dev group. The action has no runtime dependency (`packaging` is vendored).
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "codespell>=2.4.3,<3.0",
  "coverage[toml]>=7.17.2,<8.0",
  "pre-commit>=4.7.0,<5.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-timeout>=2.4,<3.0",
  "pytest>=9.2.0,<10.0",
  "pyright>=1.1.414,<2.0",
  "pyyaml>=6.0.3,<7.0",
  "ruff>=0.17.4,<1.0",
]

# Hypothesis has no wheels for free-threaded Python, so it is not in the dev group.
property = ["hypothesis>=6.170.15,<7.0"]

[tool.codespell]
skip = "*.lock,./.git,./htmlcov,coverage.xml,./.venv,./.make,./src/extract_pyproject_metadata/_vendor"
# Invalid values on purpose in the tests: a misspelt boolean and a Latin-1 byte.
ignore-words-list = "tru,caf"

[tool.coverage.run]
branch = true
source = ["src/extract_pyproject_metadata"]
# The vendored packaging is not our code.
omit = ["src/extract_pyproject_metadata/_vendor/*"]

[tool.coverage.report]
# The unit tests cover the whole script on every supported Python version.
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "^\\s*\\.\\.\\.$",
  "\\)( -> .+)?: \\.\\.\\.$",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/"]
pythonpath = ["src"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
addopts = [
  "--color",
  "yes",
  "--durations",
  "10",
  "-rf",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
timeout = 300
filterwarnings = ["error"]
# Configuration of the short test summary info
# https://docs.pytest.org/en/stable/usage.html#detailed-summary-report

[tool.ruff]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.select = [
  "A",    # builtins
  "ANN",  # annotations
  "ARG",  # flake8-unused-arguments
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (Error)
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # logging
  "N",    # naming
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (Warning)
]
lint.ignore = [
  "A003",    # Class attribute `{name}` is shadowing a python builtin
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed.
  "E501",    # Line lengths are recommended to be no greater than 79 characters.
  "W505",    # Doc line too long
  "PLR0913", # Too many arguments in function definition (8 > 5)
  "PLR2004", # Magic value used in comparison, consider replacing 0.0 with a constant variable

  # The following rules are ignored for the docstring style of this repository.
  "D102", # Missing docstring in public method
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in `__init__`
  "D205", # 1 blank line required between summary line and description
  "D209", # Multi-line docstring closing quotes should be on a separate line
]

# Enable on top of the Google convention.
lint.extend-select = ["D400", "D401", "D404"]

line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [".venv", "src/extract_pyproject_metadata/_vendor"]

[tool.ruff.lint.per-file-ignores]
# The launcher and the helpers are run as scripts, they are not a package.
"scripts/**" = ["INP001", "T201"]
# The fixtures are read by the action, not imported or linted as code.
"test-data/**" = ["D", "INP001"]
# The command line writes its result and its errors to stdout and stderr.
"src/extract_pyproject_metadata/cli.py" = ["T201"]
"src/extract_pyproject_metadata/github.py" = ["T201"]
# Ignore all directories named `tests`.
"tests/**" = [
  "D",       # pydocstyle
  "PLR0917", # Too many positional arguments: the fixtures and the parameters of a test
  "S101",    # flake8-bandit: assert is how pytest tests check
  "S108",    # fake /tmp paths in the tests
  "S603",    # the tests start the script and run.sh with fixed arguments
  "S607",    # ... and a stand-in for python3 found on PATH
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
known-first-party = ["extract_pyproject_metadata"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/extract_pyproject_metadata", "scripts/extract_metadata.py"]
exclude = ["src/extract_pyproject_metadata/_vendor"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
