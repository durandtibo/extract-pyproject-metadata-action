# Weekly updates of the GitHub Actions (pinned to a commit SHA) and of the dev dependencies.
# Updates of the same ecosystem arrive in one pull request.
# packaging is vendored: scripts/vendor_packaging.py updates it (see maintenance.yaml).

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
