# Unit, integration and property-based tests of the Python code, with the coverage gate.
# Runs on the OS and Python versions of the shared matrix (3.11 is the oldest: tomllib).
# Called from ci.yaml with the shared matrix of lib-get-test-matrix.yaml.

name: Unit Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # macOS cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Run the tests
        run: make test PYTHON_RUN=
