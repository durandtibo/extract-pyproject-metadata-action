# Main CI workflow: lint, types, unit tests, and the integration test of the action.
# Runs on pull requests, pushes to main and manual dispatch; nightly.yaml runs it every night.
# The integration test (ci-test-local.yaml) is a reusable workflow because
# nightly-test-stable.yaml is generated from it.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # to trigger manually
  workflow_call: # the release workflow runs the checks first

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest supported version

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      # PYTHON_RUN= runs the tools of the dev group from PATH, without uv (see the Makefile).
      - name: Lint the Python files
        run: make lint-python PYTHON_RUN=

      # The hooks of .pre-commit-config.yaml; pyright runs in the `types` job.
      - name: Run pre-commit
        env:
          SKIP: pyright
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check that nightly-test-stable.yaml is generated from ci-test-local.yaml
        run: make workflows-check

      - name: Check that the tables of README.md are generated from action.yaml
        run: make docs-check PYTHON_RUN=

  verify-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Verify workflow files are valid and follow best practices
      - name: Verify GitHub Workflows
        uses: durandtibo/verify-github-workflow-action@e5dc341675711838a82b2433f70a225858ad70d1 # ratchet:durandtibo/verify-github-workflow-action@v0.0.3

  # pyright reads the packages from .venv (see [tool.pyright] in pyproject.toml)
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest supported version

      - name: Install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --group dev

      # pyright reads the packages from .venv, so it runs with the interpreter of the venv.
      - name: Run pyright
        run: make types "PYTHON_RUN=.venv/bin/python -m"

  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # macOS cells are slow
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Every default python-candidate (3.11 is the oldest: tomllib); a test checks the list
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Run unit tests
        run: make test PYTHON_RUN=

  # Run the integration test of the local action
  action:
    uses: ./.github/workflows/ci-test-local.yaml
