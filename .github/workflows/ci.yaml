# Main CI workflow: it only calls the per-check reusable workflows (ci-*.yaml), so that each
# check can also be run on its own (workflow_dispatch). nightly.yaml runs it every night.
# Runs on pull requests, pushes to main, manual dispatch and from the release workflow.
#
# - lib-get-test-matrix.yaml: the shared OS and Python matrix (durandtibo/workflow-config-action).
# - ci-lint.yaml: ruff, pre-commit, generated README tables.
# - ci-type-checking.yaml: pyright.
# - ci-test.yaml: the Python tests (unit, integration, properties) on Linux and macOS.
# - ci-test-local.yaml: the integration test of the current code of the action (`uses: ./`).
# - ci-verify-workflows.yaml: lints the workflows.
# The test of the published action is nightly-test-stable.yaml (called from nightly.yaml).

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # to trigger manually
  workflow_call: # the release workflow runs the checks first

permissions:
  contents: read

jobs:
  # Load the shared OS and Python matrix from durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  lint:
    uses: ./.github/workflows/ci-lint.yaml

  verify-workflows:
    uses: ./.github/workflows/ci-verify-workflows.yaml

  types:
    uses: ./.github/workflows/ci-type-checking.yaml

  unit:
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Test the action from the current repository code (dev version)
  action:
    needs: get-matrix
    uses: ./.github/workflows/ci-test-local.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
