# Main CI workflow that orchestrates all checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# The per-check workflows (ci-*.yaml) are reusable so each can also be run on
# its own (workflow_dispatch).
# ci-verify-workflows.yaml is not called from here: it lints .github/workflows/*
# itself, so it has its own triggers.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Run the unit tests across multiple Python versions and OS
  test:
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Lint the script and the tests
  lint:
    uses: ./.github/workflows/ci-lint.yaml

  # Run the integration tests of the local action
  test-local:
    needs: get-matrix
    uses: ./.github/workflows/ci-test-local.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
