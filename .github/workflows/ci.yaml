# Main CI workflow: it only calls the per-check reusable workflows (ci-*.yaml), so that each
# check can also be run on its own (workflow_dispatch).
# Runs on pull requests, pushes to main, every night and manual dispatch.
#
# - lib-get-test-matrix.yaml: the shared OS and Python matrix (durandtibo/workflow-config-action).
# - ci-lint.yaml: ruff, pre-commit, generated README tables.
# - ci-type-checking.yaml: pyright.
# - ci-python.yaml: the Python tests (unit, integration, properties) on Linux and macOS.
# - ci-action.yaml: the integration test of the current code of the action (`uses: ./`).
# ci-verify-workflows.yaml lints the workflows; it has its own triggers and is not called from here.
# The test of the published action is nightly-test-released.yaml (called from nightly.yaml).

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

jobs:
  # Load the shared OS and Python matrix from durandtibo/workflow-config-action once.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-lint.yaml

  types:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-type-checking.yaml

  python:
    needs: get-matrix
    permissions:
      contents: read
    uses: ./.github/workflows/ci-python.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Test the action from the current repository code (dev version)
  action:
    needs: get-matrix
    permissions:
      contents: read
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
