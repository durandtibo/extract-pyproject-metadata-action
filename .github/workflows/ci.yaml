# Main CI workflow: lint, types, unit tests, and the integration test of the action.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# The integration test (ci-test-local.yaml) is a reusable workflow because
# nightly-test-stable.yaml is generated from it.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest supported version

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt --group dev

      # The hooks of .pre-commit-config.yaml; pyright runs in the `types` job.
      - name: Run pre-commit
        env:
          SKIP: pyright
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check that nightly-test-stable.yaml is generated from ci-test-local.yaml
        run: python scripts/generate_workflows.py --check

  verify-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Verify workflow files are valid and follow best practices
      - name: Verify GitHub Workflows
        uses: durandtibo/verify-github-workflow-action@e5dc341675711838a82b2433f70a225858ad70d1 # ratchet:durandtibo/verify-github-workflow-action@v0.0.3

  # pyright reads the packages from .venv (see [tool.pyright] in pyproject.toml)
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest supported version

      - name: Install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt --group dev

      - name: Run pyright
        run: .venv/bin/pyright

  unit:
    needs: get-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # free-threaded and macOS cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.get-matrix.outputs.test_matrix).os_matrix }}
        # Test all supported Python versions including free-threaded builds (t suffix)
        python-version: ${{ fromJson(needs.get-matrix.outputs.test_matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt --group dev

      - name: Run unit tests
        run: python -m pytest -v --cov --cov-report=term-missing

  # The lower bound of scripts/requirements.txt is documented as the oldest `packaging` the
  # tests were run with: check it. The coverage threshold is not enforced, because the
  # license tests are skipped with a `packaging` that cannot validate license expressions.
  unit-oldest-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest supported version

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt --group dev

      - name: Install the oldest supported packaging
        # --no-deps: the version of pytest may require a newer packaging than the action does.
        run: |
          floor="$(python -c "import re; print(re.search(r'packaging>=([0-9.]+)', open('scripts/requirements.txt').read()).group(1))")"
          echo "Installing packaging==$floor"
          pip install --no-deps --force-reinstall "packaging==$floor"
          python -c "import packaging; print(packaging.__version__)"
        shell: bash

      - name: Run unit tests
        run: python -m pytest -v -rs

  # Run the integration test of the local action
  action:
    needs: get-matrix
    uses: ./.github/workflows/ci-test-local.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
