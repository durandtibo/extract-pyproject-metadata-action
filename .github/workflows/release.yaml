# Release workflow.
# On a tag `vX.Y.Z` (pushed by hand: `git tag v0.3.0 && git push origin v0.3.0`): run the
# checks and create the GitHub release with the notes of release-notes/vX.Y.Z.md (generated
# notes when the file does not exist). Workflows pin the exact tag (`@v0.3.0`): no tag is
# moved. The checklist is in the README.

name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false # gh uses the token of the step

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
