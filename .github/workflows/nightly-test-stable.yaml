# Generated by scripts/generate_workflows.py from ci-test-local.yaml: do not edit.
# Run `make workflows` after changing ci-test-local.yaml.
name: Test Stable Action

# The integration test of the action (it can only run on GitHub). It checks the wiring: the
# inputs reach the action and the outputs come back. The logic is covered by tests/.
#
# - `stable` only uses what the latest release has: scripts/generate_workflows.py copies it
#   to nightly-test-stable.yaml, where the action is the latest release.
# - Every other job is marked `local-only` (it tests something added after the latest
#   release) and stays here. Add a job there for every new input or output.
# - Values go through `env:`, never interpolated in `run:`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # What the latest release does: a smoke test of the stable contract.
  stable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.15"] # the oldest and the newest supported version

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Test minimal pyproject.toml
        id: test-minimal
        uses: durandtibo/extract-pyproject-metadata-action@v0.2
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify minimal pyproject.toml
        env:
          NAME: ${{ steps.test-minimal.outputs.name }}
          VERSION: ${{ steps.test-minimal.outputs.version }}
          EXTRAS: ${{ steps.test-minimal.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "version" "0.1.0" "$VERSION"
          assert_equal "extras" "[]" "$EXTRAS"
          print_success "minimal pyproject.toml test passed"

      - name: 🧪 Test pyproject.toml with extras
        id: test-extras
        uses: durandtibo/extract-pyproject-metadata-action@v0.2
        with:
          pyproject-path: test-data/with-extras/pyproject.toml

      - name: ✓ Verify extras
        env:
          NAME: ${{ steps.test-extras.outputs.name }}
          VERSION: ${{ steps.test-extras.outputs.version }}
          EXTRAS: ${{ steps.test-extras.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "$NAME"
          assert_equal "version" "1.2.3" "$VERSION"
          assert_equal "extras" '["numpy","pandas"]' "$EXTRAS"
          print_success "extras test passed"

      - name: 🧪 Test missing version (should fail)
        id: test-missing-version
        uses: durandtibo/extract-pyproject-metadata-action@v0.2
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify a missing version fails the step
        env:
          OUTCOME: ${{ steps.test-missing-version.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "a missing version fails the step"
