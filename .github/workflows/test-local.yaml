name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-26.04,
            ubuntu-24.04,
            ubuntu-22.04,
            ubuntu-26.04-arm,
            ubuntu-24.04-arm,
            ubuntu-22.04-arm,
            macos-latest,
            macos-26,
            macos-15,
            macos-14,
            macos-15-intel,
          ]
        # Test all supported Python versions including free-threaded builds (t suffix)
        python-version:
          ["3.14", "3.14t", "3.13", "3.13t", "3.12", "3.11", "3.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------------------------------------------------
      # Test 1: minimal pyproject.toml (no extras)
      # -----------------------------------------------------------------------
      - name: 🧪 Test minimal pyproject.toml
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify minimal pyproject.toml
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "${{ steps.test-minimal.outputs.name }}"
          assert_equal "version" "0.1.0" "${{ steps.test-minimal.outputs.version }}"
          assert_equal "extras" "[]" '${{ steps.test-minimal.outputs.extras }}'
          print_success "minimal pyproject.toml test passed"

      # -----------------------------------------------------------------------
      # Test 2: pyproject.toml with optional-dependencies
      # -----------------------------------------------------------------------
      - name: 🧪 Test pyproject.toml with extras
        id: test-extras
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml

      - name: ✓ Verify extras
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "${{ steps.test-extras.outputs.name }}"
          assert_equal "version" "1.2.3" "${{ steps.test-extras.outputs.version }}"
          assert_equal "extras" '["numpy","pandas"]' '${{ steps.test-extras.outputs.extras }}'
          print_success "extras test passed"

      # -----------------------------------------------------------------------
      # Test 3: extra-values input is prepended
      # -----------------------------------------------------------------------
      - name: 🧪 Test extra-values input
        id: test-extra-values
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml
          extra-values: '[""]'

      - name: ✓ Verify extra-values prepended
        run: |
          source scripts/test-helper.sh
          assert_equal "extras" '["","numpy","pandas"]' '${{ steps.test-extra-values.outputs.extras }}'
          print_success "extra-values test passed"

      # -----------------------------------------------------------------------
      # Test 4: missing required key should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test missing version (should fail)
        id: test-missing-version
        uses: ./
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify missing version fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-missing-version.outcome }}" = "success" ]; then
            print_error "Missing version should cause the step to fail"
            exit 1
          fi
          print_success "missing version correctly failed"

      # -----------------------------------------------------------------------
      # Test 5: missing file should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test missing file (should fail)
        id: test-missing-file
        uses: ./
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify missing file fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-missing-file.outcome }}" = "success" ]; then
            print_error "Missing file should cause the step to fail"
            exit 1
          fi
          print_success "missing file correctly failed"

      # -----------------------------------------------------------------------
      # Test 6: invalid extra-values JSON should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test invalid extra-values (should fail)
        id: test-invalid-extra-values
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: ✓ Verify invalid extra-values fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-invalid-extra-values.outcome }}" = "success" ]; then
            print_error "Invalid extra-values should cause the step to fail"
            exit 1
          fi
          print_success "invalid extra-values correctly failed"

      # -----------------------------------------------------------------------
      # Test 7: dynamic version gives an empty version output
      # -----------------------------------------------------------------------
      - name: 🧪 Test dynamic version
        id: test-dynamic-version
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml

      - name: ✓ Verify dynamic version is empty
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "dynamic-pkg" "${{ steps.test-dynamic-version.outputs.name }}"
          assert_equal "version" "" "${{ steps.test-dynamic-version.outputs.version }}"
          assert_equal "extras" '["numpy"]' '${{ steps.test-dynamic-version.outputs.extras }}'
          print_success "dynamic version test passed"

      # -----------------------------------------------------------------------
      # Test 8: dependencies input is looked up in the pyproject.toml
      # -----------------------------------------------------------------------
      - name: 🧪 Test dependencies input
        id: test-dependencies
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","foo.bar","nospec","numpy","grp-pkg","dev-pkg","missing"]'

      - name: ✓ Verify dependency-specifiers
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "deps-pkg" "${{ steps.test-dependencies.outputs.name }}"
          assert_equal "dependency-specifiers" '{"invoke-tasklib":"<1.0.0,>=0.0.8","foo.bar":"==2.1","nospec":"","numpy":"~=2.0","grp-pkg":">=1.5","dev-pkg":"<3","missing":null}' '${{ steps.test-dependencies.outputs.dependency-specifiers }}'
          print_success "dependencies test passed"

      # -----------------------------------------------------------------------
      # Test 9: dependency-specifiers is an empty object by default
      # -----------------------------------------------------------------------
      - name: 🧪 Test default dependencies
        id: test-default-dependencies
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml

      - name: ✓ Verify default dependency-specifiers
        run: |
          source scripts/test-helper.sh
          assert_equal "dependency-specifiers" '{}' '${{ steps.test-default-dependencies.outputs.dependency-specifiers }}'
          print_success "default dependencies test passed"

      # -----------------------------------------------------------------------
      # Test 10: invalid dependencies JSON should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test invalid dependencies (should fail)
        id: test-invalid-dependencies
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '{"not": "an array"}'
        continue-on-error: true

      - name: ✓ Verify invalid dependencies fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-invalid-dependencies.outcome }}" = "success" ]; then
            print_error "Invalid dependencies should cause the step to fail"
            exit 1
          fi
          print_success "invalid dependencies correctly failed"

      # -----------------------------------------------------------------------
      # Test 11: normalized-name output
      # -----------------------------------------------------------------------
      - name: 🧪 Test normalized-name output
        id: test-normalized-name
        uses: ./
        with:
          pyproject-path: test-data/normalized-name/pyproject.toml

      - name: ✓ Verify normalized-name
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "My_Package.Name" "${{ steps.test-normalized-name.outputs.name }}"
          assert_equal "normalized-name" "my-package-name" "${{ steps.test-normalized-name.outputs.normalized-name }}"
          print_success "normalized-name test passed"

      # -----------------------------------------------------------------------
      # Test 12: requires-python output
      # -----------------------------------------------------------------------
      - name: 🧪 Test requires-python output
        id: test-requires-python
        uses: ./
        with:
          pyproject-path: test-data/requires-python/pyproject.toml

      - name: 🧪 Test requires-python output when not declared
        id: test-no-requires-python
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify requires-python
        run: |
          source scripts/test-helper.sh
          assert_equal "requires-python" ">=3.10,<4" '${{ steps.test-requires-python.outputs.requires-python }}'
          assert_equal "requires-python" "" '${{ steps.test-no-requires-python.outputs.requires-python }}'
          print_success "requires-python test passed"

      # -----------------------------------------------------------------------
      # Test 13: groups output
      # -----------------------------------------------------------------------
      - name: 🧪 Test groups output
        id: test-groups
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml

      - name: 🧪 Test groups output without dependency groups
        id: test-no-groups
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify groups
        run: |
          source scripts/test-helper.sh
          assert_equal "groups" '["base","dev"]' '${{ steps.test-groups.outputs.groups }}'
          assert_equal "groups" '[]' '${{ steps.test-no-groups.outputs.groups }}'
          print_success "groups test passed"

      # -----------------------------------------------------------------------
      # Test 14: fail-on-missing input
      # -----------------------------------------------------------------------
      - name: 🧪 Test fail-on-missing with all dependencies found
        id: test-fail-on-missing-found
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","nospec"]'
          fail-on-missing: "true"

      - name: ✓ Verify fail-on-missing succeeds when all dependencies are found
        run: |
          source scripts/test-helper.sh
          assert_equal "dependency-specifiers" '{"invoke-tasklib":"<1.0.0,>=0.0.8","nospec":""}' '${{ steps.test-fail-on-missing-found.outputs.dependency-specifiers }}'
          print_success "fail-on-missing (all found) test passed"

      - name: 🧪 Test fail-on-missing with a missing dependency (should fail)
        id: test-fail-on-missing
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","missing"]'
          fail-on-missing: "true"
        continue-on-error: true

      - name: ✓ Verify fail-on-missing fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-fail-on-missing.outcome }}" = "success" ]; then
            print_error "A missing dependency with fail-on-missing should cause the step to fail"
            exit 1
          fi
          print_success "fail-on-missing correctly failed"

      - name: 🧪 Test invalid fail-on-missing (should fail)
        id: test-invalid-fail-on-missing
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          fail-on-missing: "maybe"
        continue-on-error: true

      - name: ✓ Verify invalid fail-on-missing fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-invalid-fail-on-missing.outcome }}" = "success" ]; then
            print_error "Invalid fail-on-missing should cause the step to fail"
            exit 1
          fi
          print_success "invalid fail-on-missing correctly failed"

      # -----------------------------------------------------------------------
      # Test 15: python-versions output and python-candidates input
      # -----------------------------------------------------------------------
      - name: 🧪 Test python-versions output with the default candidates
        id: test-python-versions
        uses: ./
        with:
          pyproject-path: test-data/requires-python/pyproject.toml

      - name: 🧪 Test python-versions output with custom candidates
        id: test-python-candidates
        uses: ./
        with:
          pyproject-path: test-data/requires-python/pyproject.toml
          python-candidates: '["3.9","3.10","3.12"]'

      - name: 🧪 Test python-versions output when requires-python is not declared
        id: test-python-versions-undeclared
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          python-candidates: '["3.9","3.12"]'

      - name: ✓ Verify python-versions
        run: |
          source scripts/test-helper.sh
          assert_equal "python-versions" '["3.10","3.11","3.12","3.13","3.14"]' '${{ steps.test-python-versions.outputs.python-versions }}'
          assert_equal "python-versions" '["3.10","3.12"]' '${{ steps.test-python-candidates.outputs.python-versions }}'
          assert_equal "python-versions" '["3.9","3.12"]' '${{ steps.test-python-versions-undeclared.outputs.python-versions }}'
          print_success "python-versions test passed"

      - name: 🧪 Test invalid python-candidates (should fail)
        id: test-invalid-python-candidates
        uses: ./
        with:
          pyproject-path: test-data/requires-python/pyproject.toml
          python-candidates: '["3.12.1"]'
        continue-on-error: true

      - name: ✓ Verify invalid python-candidates fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-invalid-python-candidates.outcome }}" = "success" ]; then
            print_error "Invalid python-candidates should cause the step to fail"
            exit 1
          fi
          print_success "invalid python-candidates correctly failed"

      # -----------------------------------------------------------------------
      # Test 16: project-dependencies output
      # -----------------------------------------------------------------------
      - name: 🧪 Test project-dependencies output
        id: test-project-dependencies
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml

      - name: 🧪 Test project-dependencies output without dependencies
        id: test-no-project-dependencies
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify project-dependencies
        run: |
          source scripts/test-helper.sh
          assert_equal "project-dependencies" '{"invoke-tasklib":"<1.0.0,>=0.0.8","Foo_Bar":"==2.1","nospec":""}' '${{ steps.test-project-dependencies.outputs.project-dependencies }}'
          assert_equal "project-dependencies" '{}' '${{ steps.test-no-project-dependencies.outputs.project-dependencies }}'
          print_success "project-dependencies test passed"
