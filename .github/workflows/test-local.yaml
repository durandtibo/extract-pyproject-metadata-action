name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          ubuntu-26.04,
          ubuntu-24.04,
          ubuntu-22.04,
          ubuntu-26.04-arm,
          ubuntu-24.04-arm,
          ubuntu-22.04-arm,
          macos-latest,
          macos-26,
          macos-15,
          macos-14,
          macos-15-intel,
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Test 1: minimal pyproject.toml (no extras)
      # -----------------------------------------------------------------------
      - name: 🧪 Test minimal pyproject.toml
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify minimal pyproject.toml
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "${{ steps.test-minimal.outputs.name }}"
          assert_equal "version" "0.1.0" "${{ steps.test-minimal.outputs.version }}"
          assert_equal "extras" "[]" '${{ steps.test-minimal.outputs.extras }}'
          print_success "minimal pyproject.toml test passed"

      # -----------------------------------------------------------------------
      # Test 2: pyproject.toml with optional-dependencies
      # -----------------------------------------------------------------------
      - name: 🧪 Test pyproject.toml with extras
        id: test-extras
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml

      - name: ✓ Verify extras
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "${{ steps.test-extras.outputs.name }}"
          assert_equal "version" "1.2.3" "${{ steps.test-extras.outputs.version }}"
          assert_equal "extras" '["numpy","pandas"]' '${{ steps.test-extras.outputs.extras }}'
          print_success "extras test passed"

      # -----------------------------------------------------------------------
      # Test 3: extra-values input is prepended
      # -----------------------------------------------------------------------
      - name: 🧪 Test extra-values input
        id: test-extra-values
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml
          extra-values: '[""]'

      - name: ✓ Verify extra-values prepended
        run: |
          source scripts/test-helper.sh
          assert_equal "extras" '["","numpy","pandas"]' '${{ steps.test-extra-values.outputs.extras }}'
          print_success "extra-values test passed"

      # -----------------------------------------------------------------------
      # Test 4: missing required key should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test missing version (should fail)
        id: test-missing-version
        uses: ./
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify missing version fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-missing-version.outcome }}" = "success" ]; then
            print_error "Missing version should cause the step to fail"
            exit 1
          fi
          print_success "missing version correctly failed"

      # -----------------------------------------------------------------------
      # Test 5: missing file should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test missing file (should fail)
        id: test-missing-file
        uses: ./
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify missing file fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-missing-file.outcome }}" = "success" ]; then
            print_error "Missing file should cause the step to fail"
            exit 1
          fi
          print_success "missing file correctly failed"

      # -----------------------------------------------------------------------
      # Test 6: invalid extra-values JSON should fail the step
      # -----------------------------------------------------------------------
      - name: 🧪 Test invalid extra-values (should fail)
        id: test-invalid-extra-values
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: ✓ Verify invalid extra-values fails the step
        run: |
          source scripts/test-helper.sh
          if [ "${{ steps.test-invalid-extra-values.outcome }}" = "success" ]; then
            print_error "Invalid extra-values should cause the step to fail"
            exit 1
          fi
          print_success "invalid extra-values correctly failed"
