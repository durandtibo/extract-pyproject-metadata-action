name: Test Action

# The integration test of the action (it can only run on GitHub), on the code of this checkout
# (`use-released: false`, `uses: ./`, called from ci.yaml) or on the latest published tag
# (`use-released: true`, pinned by SHA, called from nightly.yaml). Every action step exists twice,
# `<id>-local` and `<id>-released`, and the verify step reads the outputs of the one that ran.
# It checks that the action works as a whole: the inputs reach the program, every output comes
# back with the right value, the invalid inputs and the warnings with `strict` fail the step, and
# nothing is left behind. The logic is covered by tests/.
#
# General behaviour, on the full matrix (the OS and Python lists of
# durandtibo/workflow-config-action, loaded by lib-get-test-matrix.yaml):
# - `test` runs the action with every input and on a minimal file, and checks every output.
# Edge cases, on one runner (`ubuntu-latest`, with a fixed Python):
# - `golden` compares the whole `json` output of a few cases (test-data/) with their golden file.
# - The other jobs each check one input or one situation; the failures use `continue-on-error`
#   and check the outcome and that no output was set.
#
# - Add a job or a golden case for every new input or output.
# - A check of a feature that the last release does not have yet is skipped by the released run
#   (`if: ${{ !inputs.use-released }}` on the job) until the next release; then remove the `if`
#   and update the pinned SHA and tag in every released step (bot-pin-action.yaml keeps the SHA of
#   the tag).
# - Values go through `env:`, never interpolated in `run:`.

on:
  workflow_call:
    inputs:
      use-released:
        description: "Test the latest published release of the action instead of this checkout"
        required: false
        default: false
        type: boolean
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # General behaviour: the success path on every OS and Python version of the shared matrix.
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Run the action with every input (local)
        id: action-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/readme-example/pyproject.toml
          extra-values: '[""]'
          dependencies: '["numpy", "pytest@group:dev", "missing"]'
          python-candidates: '["3.11","3.12","3.13"]'
          strict: "false"

      - name: 🧪 Run the action with every input (released)
        id: action-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/readme-example/pyproject.toml
          extra-values: '[""]'
          dependencies: '["numpy", "pytest@group:dev", "missing"]'
          python-candidates: '["3.11","3.12","3.13"]'
          strict: "false"

      - name: ✓ Verify every output
        env:
          NAME: ${{ steps.action-local.outputs.name || steps.action-released.outputs.name }}
          NORMALIZED_NAME: ${{ steps.action-local.outputs.normalized-name || steps.action-released.outputs.normalized-name }}
          FILE_NAME: ${{ steps.action-local.outputs.file-name || steps.action-released.outputs.file-name }}
          VERSION: ${{ steps.action-local.outputs.version || steps.action-released.outputs.version }}
          NORMALIZED_VERSION: ${{ steps.action-local.outputs.normalized-version || steps.action-released.outputs.normalized-version }}
          REQUIRES_PYTHON: ${{ steps.action-local.outputs.requires-python || steps.action-released.outputs.requires-python }}
          PYTHON_VERSIONS: ${{ steps.action-local.outputs.python-versions || steps.action-released.outputs.python-versions }}
          PYTHON_MIN: ${{ steps.action-local.outputs.python-min || steps.action-released.outputs.python-min }}
          PYTHON_MAX: ${{ steps.action-local.outputs.python-max || steps.action-released.outputs.python-max }}
          EXTRAS: ${{ steps.action-local.outputs.extras || steps.action-released.outputs.extras }}
          GROUPS_: ${{ steps.action-local.outputs.groups || steps.action-released.outputs.groups }}
          SPECIFIERS: ${{ steps.action-local.outputs.dependency-specifiers || steps.action-released.outputs.dependency-specifiers }}
          JSON: ${{ steps.action-local.outputs.json || steps.action-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "My_Package" "$NAME"
          assert_equal "normalized-name" "my-package" "$NORMALIZED_NAME"
          assert_equal "file-name" "my_package" "$FILE_NAME"
          assert_equal "version" "1.2.3" "$VERSION"
          assert_equal "normalized-version" "1.2.3" "$NORMALIZED_VERSION"
          assert_equal "requires-python" ">=3.12" "$REQUIRES_PYTHON"
          assert_equal "python-versions" '["3.12","3.13"]' "$PYTHON_VERSIONS"
          assert_equal "python-min" "3.12" "$PYTHON_MIN"
          assert_equal "python-max" "3.13" "$PYTHON_MAX"
          assert_equal "extras" '["","numpy","pandas"]' "$EXTRAS"
          assert_equal "groups" '["dev"]' "$GROUPS_"
          assert_equal "dependency-specifiers" '{"numpy":"<3,>=1.20","pytest@group:dev":">=8","missing":null}' "$SPECIFIERS"
          assert_equal "json: extras" '["","numpy","pandas"]' "$(jq -c .extras <<< "$JSON")"
          assert_equal "json: warning code" "dependency-not-found" "$(jq -r '.warnings[0].code' <<< "$JSON")"
          print_success "every output has the expected value"

      - name: 🧪 Run the action on a minimal file (local)
        id: minimal-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: 🧪 Run the action on a minimal file (released)
        id: minimal-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify the defaults
        env:
          NAME: ${{ steps.minimal-local.outputs.name || steps.minimal-released.outputs.name }}
          VERSION: ${{ steps.minimal-local.outputs.version || steps.minimal-released.outputs.version }}
          EXTRAS: ${{ steps.minimal-local.outputs.extras || steps.minimal-released.outputs.extras }}
          GROUPS_: ${{ steps.minimal-local.outputs.groups || steps.minimal-released.outputs.groups }}
          SPECIFIERS: ${{ steps.minimal-local.outputs.dependency-specifiers || steps.minimal-released.outputs.dependency-specifiers }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "version" "0.1.0" "$VERSION"
          assert_equal "extras" "[]" "$EXTRAS"
          assert_equal "groups" "[]" "$GROUPS_"
          assert_equal "dependency-specifiers" "{}" "$SPECIFIERS"
          print_success "the defaults are applied"

      - name: ✓ Verify the action leaves nothing behind
        run: |
          source scripts/test-helper.sh
          assert_equal "__pycache__ directories" "0" "$(count_pycache)"
          print_success "nothing left behind"

  # A warning is reported in the json output and fails the step only with strict.
  test-warning:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 🧪 Run the action on a file with a dynamic version (local)
        id: action-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml

      - name: 🧪 Run the action on a file with a dynamic version (released)
        id: action-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml

      - name: ✓ Verify a warning does not fail the step without strict
        env:
          OUTCOME: ${{ inputs.use-released && steps.action-released.outcome || steps.action-local.outcome }}
          NAME: ${{ steps.action-local.outputs.name || steps.action-released.outputs.name }}
          VERSION: ${{ steps.action-local.outputs.version || steps.action-released.outputs.version }}
          JSON: ${{ steps.action-local.outputs.json || steps.action-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "success" "$OUTCOME"
          assert_equal "name" "dynamic-pkg" "$NAME"
          assert_equal "version" "" "$VERSION"
          assert_equal "warning code" "dynamic-version" "$(jq -r '.warnings[0].code' <<< "$JSON")"
          print_success "a warning is reported and does not fail the step"

  # The default of pyproject-path is `pyproject.toml` of the workspace.
  test-default-path:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Put a pyproject.toml at the default path
        run: cp test-data/with-extras/pyproject.toml pyproject.toml

      - name: 🧪 Run the action without pyproject-path (local)
        id: action-local
        if: ${{ !inputs.use-released }}
        uses: ./

      - name: 🧪 Run the action without pyproject-path (released)
        id: action-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0

      - name: ✓ Verify the file at the default path is read
        env:
          NAME: ${{ steps.action-local.outputs.name || steps.action-released.outputs.name }}
          EXTRAS: ${{ steps.action-local.outputs.extras || steps.action-released.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "$NAME"
          assert_equal "extras" '["numpy","pandas"]' "$EXTRAS"
          print_success "the default pyproject-path is read"

  # The path reaches the program unsplit.
  test-path-with-spaces:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Copy the file to a path with spaces
        run: |
          mkdir "dir with spaces"
          cp test-data/with-extras/pyproject.toml "dir with spaces/my pyproject.toml"

      - name: 🧪 Run the action on the path with spaces (local)
        id: action-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: dir with spaces/my pyproject.toml

      - name: 🧪 Run the action on the path with spaces (released)
        id: action-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: dir with spaces/my pyproject.toml

      - name: ✓ Verify the file is read
        env:
          NAME: ${{ steps.action-local.outputs.name || steps.action-released.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "$NAME"
          print_success "a path with spaces is read"

  # `strict` fails the step on a warning, and only on a warning.
  test-strict:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 🧪 Run the action with strict and no warning (local)
        id: clean-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          strict: "true"

      - name: 🧪 Run the action with strict and no warning (released)
        id: clean-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          strict: "true"

      - name: ✓ Verify strict does not fail without a warning
        env:
          OUTCOME: ${{ inputs.use-released && steps.clean-released.outcome || steps.clean-local.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "success" "$OUTCOME"
          print_success "strict does not fail without a warning"

      - name: 🧪 Run the action with strict on a warning (local)
        id: warning-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml
          strict: "true"
        continue-on-error: true

      - name: 🧪 Run the action with strict on a warning (released)
        id: warning-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml
          strict: "true"
        continue-on-error: true

      - name: ✓ Verify strict with a warning fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.warning-released.outcome || steps.warning-local.outcome }}
          JSON: ${{ steps.warning-local.outputs.json || steps.warning-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "strict with a warning fails the step"

      - name: 🧪 Run the action with strict on a missing dependency (local)
        id: missing-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","missing"]'
          strict: "true"
        continue-on-error: true

      - name: 🧪 Run the action with strict on a missing dependency (released)
        id: missing-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","missing"]'
          strict: "true"
        continue-on-error: true

      - name: ✓ Verify strict with a missing dependency fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.missing-released.outcome || steps.missing-local.outcome }}
          JSON: ${{ steps.missing-local.outputs.json || steps.missing-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "strict with a missing dependency fails the step"

  # Invalid inputs and files fail the step without setting an output.
  test-invalid-inputs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 🧪 Run the action on a valid file (local)
        id: valid-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: 🧪 Run the action on a valid file (released)
        id: valid-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify the valid file succeeds, so that the failures below are caused by the inputs
        env:
          OUTCOME: ${{ inputs.use-released && steps.valid-released.outcome || steps.valid-local.outcome }}
          NAME: ${{ steps.valid-local.outputs.name || steps.valid-released.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "success" "$OUTCOME"
          assert_equal "name" "minimal-pkg" "$NAME"
          print_success "the valid file succeeds"

      - name: 🧪 Run the action with a missing file (local)
        id: missing-file-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: 🧪 Run the action with a missing file (released)
        id: missing-file-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify a missing file fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.missing-file-released.outcome || steps.missing-file-local.outcome }}
          JSON: ${{ steps.missing-file-local.outputs.json || steps.missing-file-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "a missing file fails the step"

      - name: 🧪 Run the action with a missing version (local)
        id: missing-version-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: 🧪 Run the action with a missing version (released)
        id: missing-version-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify a missing version fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.missing-version-released.outcome || steps.missing-version-local.outcome }}
          JSON: ${{ steps.missing-version-local.outputs.json || steps.missing-version-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "a missing version fails the step"

      - name: 🧪 Run the action with an invalid extra-values (local)
        id: extra-values-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: 🧪 Run the action with an invalid extra-values (released)
        id: extra-values-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: ✓ Verify an invalid extra-values fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.extra-values-released.outcome || steps.extra-values-local.outcome }}
          JSON: ${{ steps.extra-values-local.outputs.json || steps.extra-values-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "an invalid extra-values fails the step"

      - name: 🧪 Run the action with an invalid dependencies (local)
        id: dependencies-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          dependencies: '"numpy"'
        continue-on-error: true

      - name: 🧪 Run the action with an invalid dependencies (released)
        id: dependencies-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          dependencies: '"numpy"'
        continue-on-error: true

      - name: ✓ Verify an invalid dependencies fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.dependencies-released.outcome || steps.dependencies-local.outcome }}
          JSON: ${{ steps.dependencies-local.outputs.json || steps.dependencies-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "an invalid dependencies fails the step"

      - name: 🧪 Run the action with an invalid python-candidates (local)
        id: python-candidates-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          python-candidates: '["three"]'
        continue-on-error: true

      - name: 🧪 Run the action with an invalid python-candidates (released)
        id: python-candidates-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          python-candidates: '["three"]'
        continue-on-error: true

      - name: ✓ Verify an invalid python-candidates fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.python-candidates-released.outcome || steps.python-candidates-local.outcome }}
          JSON: ${{ steps.python-candidates-local.outputs.json || steps.python-candidates-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "an invalid python-candidates fails the step"

      - name: 🧪 Run the action with an invalid strict (local)
        id: strict-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          strict: "yes"
        continue-on-error: true

      - name: 🧪 Run the action with an invalid strict (released)
        id: strict-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          strict: "yes"
        continue-on-error: true

      - name: ✓ Verify an invalid strict fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.strict-released.outcome || steps.strict-local.outcome }}
          JSON: ${{ steps.strict-local.outputs.json || steps.strict-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "an invalid strict fails the step"

      - name: ✓ Verify the action leaves nothing behind
        run: |
          source scripts/test-helper.sh
          assert_equal "__pycache__ directories" "0" "$(count_pycache)"
          print_success "nothing left behind"

  # Only Python 3.11 or later is supported: the action must fail with an explicit error.
  test-old-python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 🧪 Run the action with Python 3.10 (local)
        id: old-python-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        continue-on-error: true

      - name: 🧪 Run the action with Python 3.10 (released)
        id: old-python-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify Python 3.10 fails the step and sets no output
        env:
          OUTCOME: ${{ inputs.use-released && steps.old-python-released.outcome || steps.old-python-local.outcome }}
          JSON: ${{ steps.old-python-local.outputs.json || steps.old-python-released.outputs.json }}
        run: |
          source scripts/test-helper.sh
          assert_failed "$OUTCOME" "$JSON"
          print_success "Python 3.10 fails the step"

  # Each case runs the action with the inputs of its inputs.json (the other inputs have their
  # default, repeated here: tests/integration/test_workflows.py checks them against action.yaml)
  # and compares the json output with its expected.json. tests/integration/test_golden.py
  # checks every case of test-data/ without GitHub; this job only checks the wiring, with three
  # cases: `minimal` (the defaults), `readme-example` (every output filled) and
  # `python-candidates-none` (a warning). The list is explicit: a test checks that the cases
  # exist and that, together, they set every input and fill every output of action.yaml.
  golden:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: [minimal, readme-example, python-candidates-none]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the inputs of the case
        id: case
        env:
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          file="test-data/$CASE/inputs.json"
          if [ -f "$file" ]; then given="$(jq -c . "$file")"; else given='{}'; fi
          # The default of the action, unless the case sets python-candidates.
          inputs="$(jq -c --arg candidates "$(action_default python-candidates)" \
            '{"python-candidates": $candidates} + .' <<<"$given")"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run the action on the case (local)
        id: action-local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          pyproject-path: ${{ fromJSON(steps.case.outputs.inputs)['pyproject-path'] || format('test-data/{0}/pyproject.toml', matrix.case) }}
          extra-values: ${{ fromJSON(steps.case.outputs.inputs)['extra-values'] || '[]' }}
          dependencies: ${{ fromJSON(steps.case.outputs.inputs)['dependencies'] || '[]' }}
          python-candidates: ${{ fromJSON(steps.case.outputs.inputs)['python-candidates'] }}
          strict: ${{ fromJSON(steps.case.outputs.inputs)['strict'] || 'false' }}

      - name: 🧪 Run the action on the case (released)
        id: action-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/extract-pyproject-metadata-action@6d9935d8d2af1ffc9baa090b516342e152dac85f # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.0
        with:
          pyproject-path: ${{ fromJSON(steps.case.outputs.inputs)['pyproject-path'] || format('test-data/{0}/pyproject.toml', matrix.case) }}
          extra-values: ${{ fromJSON(steps.case.outputs.inputs)['extra-values'] || '[]' }}
          dependencies: ${{ fromJSON(steps.case.outputs.inputs)['dependencies'] || '[]' }}
          python-candidates: ${{ fromJSON(steps.case.outputs.inputs)['python-candidates'] }}
          strict: ${{ fromJSON(steps.case.outputs.inputs)['strict'] || 'false' }}

      - name: ✓ Compare the json output with the golden file
        env:
          EXPECTED: test-data/${{ matrix.case }}/expected.json
          ACTUAL: ${{ steps.action-local.outputs.json || steps.action-released.outputs.json }}
        run: python scripts/compare_json.py "$EXPECTED" "$ACTUAL"
