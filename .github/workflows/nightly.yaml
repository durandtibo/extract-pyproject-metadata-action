# Nightly workflow, the only scheduled one.
# Runs the CI (to catch changes of the runner images and of the dependencies) and the integration
# tests of the latest release of the action (nightly-test-stable.yaml, generated).

name: Nightly
on:
  schedule:
    - cron: "20 9 * * *" # Run nightly at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  test-stable:
    uses: ./.github/workflows/nightly-test-stable.yaml
