# Nightly workflow, the only scheduled one for the checks.
# Runs the CI (to catch changes of the runner images and of the dependencies) and the test of
# the latest stable, published version of the action (nightly-test-stable.yaml).

name: Nightly
on:
  schedule:
    - cron: "20 9 * * *" # Run nightly at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  # Load the shared OS and Python matrix from durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-stable.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
