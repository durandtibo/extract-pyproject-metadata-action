# Nightly workflow testing the latest published version of the action, to catch regressions in
# what consumers pick up (nightly-test-released.yaml). The current code is tested nightly by ci.yaml.

name: Nightly Tests
on:
  schedule:
    - cron: "20 9 * * *" # Run nightly at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

jobs:
  # Load the shared OS and Python matrix from durandtibo/workflow-config-action once.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Test the latest released action
  test-released:
    needs: get-matrix
    permissions:
      contents: read
    uses: ./.github/workflows/nightly-test-released.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
