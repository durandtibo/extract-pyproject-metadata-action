# Nightly workflow testing the latest published version of the action, to catch regressions in
# what consumers pick up: it calls ci-action.yaml with `use-released: true` (the archive of the
# newest `v*` tag), and runs one smoke step of the published action (`uses: owner/repo@sha`,
# the only test of GitHub's own resolution of it; bot-pin-action.yaml keeps the SHA of the tag).
# The current code is tested nightly by ci.yaml.

name: Nightly Tests
on:
  schedule:
    - cron: "20 9 * * *" # Run nightly at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS and Python matrix from durandtibo/workflow-config-action once.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Test the latest released action
  test-released:
    needs: get-matrix
    permissions:
      contents: read
    uses: ./.github/workflows/ci-action.yaml
    with:
      use-released: true
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Smoke test of the published action as GitHub resolves it. After a release, the SHA and the tag
  # of this step are the only things to update (bot-pin-action.yaml does it).
  smoke-released:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 🧪 Run the published action on a minimal file
        id: smoke
        uses: durandtibo/extract-pyproject-metadata-action@aa5867876178387ad9d5da757d157c5febfaef5d # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.1
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify the outputs
        env:
          NAME: ${{ steps.smoke.outputs.name }}
          VERSION: ${{ steps.smoke.outputs.version }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "version" "0.1.0" "$VERSION"
          print_success "the published action works"
