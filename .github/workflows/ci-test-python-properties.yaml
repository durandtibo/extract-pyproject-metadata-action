# Property-based tests workflow.
# Runs the Hypothesis tests of tests/properties/ on ubuntu-latest across the standard
# (non-free-threaded) Python versions of the shared matrix, because hypothesis has no wheels for
# free-threaded builds (it is in the `property` dependency group, not in `dev`; the tests are
# skipped when it is missing). Called from ci.yaml with the matrix of lib-get-test-matrix.yaml.

name: Property-based Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

jobs:
  properties:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev and property dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev --group property

      - name: Run the property-based tests
        run: make test-properties PYTHON_RUN=
