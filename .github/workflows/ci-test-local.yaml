name: Test Local Action

# The integration test of the action (it can only run on GitHub). It checks the wiring: the
# inputs reach the action and the outputs come back. The logic is covered by tests/.
#
# - `stable` only uses what the latest release has: scripts/generate_workflows.py copies it
#   to nightly-test-stable.yaml, where the action is the latest release.
# - Every other job is marked `local-only` (it tests something added after the latest
#   release) and stays here. Add a job there for every new input or output.
# - Values go through `env:`, never interpolated in `run:`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # What the latest release does: a smoke test of the stable contract.
  stable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"] # the oldest and the newest supported version

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Test minimal pyproject.toml
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify minimal pyproject.toml
        env:
          NAME: ${{ steps.test-minimal.outputs.name }}
          VERSION: ${{ steps.test-minimal.outputs.version }}
          EXTRAS: ${{ steps.test-minimal.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "version" "0.1.0" "$VERSION"
          assert_equal "extras" "[]" "$EXTRAS"
          print_success "minimal pyproject.toml test passed"

      - name: 🧪 Test pyproject.toml with extras
        id: test-extras
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml

      - name: ✓ Verify extras
        env:
          NAME: ${{ steps.test-extras.outputs.name }}
          VERSION: ${{ steps.test-extras.outputs.version }}
          EXTRAS: ${{ steps.test-extras.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "$NAME"
          assert_equal "version" "1.2.3" "$VERSION"
          assert_equal "extras" '["numpy","pandas"]' "$EXTRAS"
          print_success "extras test passed"

      - name: 🧪 Test missing version (should fail)
        id: test-missing-version
        uses: ./
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify a missing version fails the step
        env:
          OUTCOME: ${{ steps.test-missing-version.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "a missing version fails the step"

  # The list of the cases is the list of the directories of test-data/ with an expected.json.
  cases:
    # local-only
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      cases: ${{ steps.list.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: List the cases
        id: list
        run: |
          cases="$(for file in test-data/*/expected.json; do basename "$(dirname "$file")"; done | jq -R . | jq -sc .)"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  # Each case runs the action with the inputs of its inputs.json (the other inputs have their
  # default, repeated here: tests/integration/test_workflows.py checks them against action.yaml)
  # and compares the json output with its expected.json. tests/integration/test_golden.py
  # checks the same files without GitHub.
  golden:
    # local-only
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the inputs of the case
        id: case
        env:
          CASE: ${{ matrix.case }}
        run: |
          file="test-data/$CASE/inputs.json"
          if [ -f "$file" ]; then inputs="$(jq -c . "$file")"; else inputs='{}'; fi
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run the action on the case
        id: action
        uses: ./
        with:
          pyproject-path: ${{ fromJSON(steps.case.outputs.inputs)['pyproject-path'] || format('test-data/{0}/pyproject.toml', matrix.case) }}
          extra-values: ${{ fromJSON(steps.case.outputs.inputs)['extra-values'] || '[]' }}
          dependencies: ${{ fromJSON(steps.case.outputs.inputs)['dependencies'] || '[]' }}
          python-candidates: ${{ fromJSON(steps.case.outputs.inputs)['python-candidates'] || '' }}
          strict: ${{ fromJSON(steps.case.outputs.inputs)['strict'] || 'false' }}

      - name: ✓ Compare the json output with the golden file
        env:
          EXPECTED: test-data/${{ matrix.case }}/expected.json
          ACTUAL: ${{ steps.action.outputs.json }}
        run: python scripts/compare_json.py "$EXPECTED" "$ACTUAL"

  # What the golden files cannot see: failures, strict, and what the action leaves behind.
  wiring:
    # local-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"] # the oldest and the newest supported version

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Test a successful run
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Compare the json output with the golden file
        env:
          EXPECTED: test-data/minimal/expected.json
          ACTUAL: ${{ steps.test-minimal.outputs.json }}
        run: python scripts/compare_json.py "$EXPECTED" "$ACTUAL"

      - name: 🧪 Test a missing file (should fail)
        id: test-missing-file
        uses: ./
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify Test a missing file fails the step
        env:
          OUTCOME: ${{ steps.test-missing-file.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test a missing file fails the step"

      - name: 🧪 Test an invalid extra-values (should fail)
        id: test-invalid-input
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: ✓ Verify Test an invalid extra-values fails the step
        env:
          OUTCOME: ${{ steps.test-invalid-input.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test an invalid extra-values fails the step"

      - name: 🧪 Test strict with a warning (should fail)
        id: test-strict
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml
          strict: "true"
        continue-on-error: true

      - name: ✓ Verify Test strict with a warning fails the step
        env:
          OUTCOME: ${{ steps.test-strict.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test strict with a warning fails the step"

      - name: 🧪 Test the same file without strict
        id: test-not-strict
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml

      - name: ✓ Verify a warning does not fail the step without strict
        env:
          OUTCOME: ${{ steps.test-not-strict.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "success" "$OUTCOME"
          print_success "a warning does not fail the step without strict"

      - name: 🧪 Test strict with a missing dependency (should fail)
        id: test-strict-missing
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","missing"]'
          strict: "true"
        continue-on-error: true

      - name: ✓ Verify Test strict with a missing dependency fails the step
        env:
          OUTCOME: ${{ steps.test-strict-missing.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test strict with a missing dependency fails the step"

      - name: ✓ Verify the action leaves nothing behind
        run: |
          source scripts/test-helper.sh
          assert_equal "__pycache__ directories" "0" "$(count_pycache)"
          print_success "nothing left behind"

  # Only Python 3.11 or later is supported: the action must fail with an explicit error
  test-old-python:
    # local-only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 🧪 Test the action with Python 3.10 (should fail)
        id: test-old-python
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify Python 3.10 is rejected
        env:
          OUTCOME: ${{ steps.test-old-python.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Python 3.10 is rejected"
