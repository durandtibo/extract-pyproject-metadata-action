name: Test Local Action

# The integration test of the action (it can only run on GitHub). It checks the wiring: the
# inputs reach the action and the outputs come back. The logic is covered by tests/.
#
# - `stable` only uses what the latest release has: scripts/generate_workflows.py copies it
#   to nightly-test-stable.yaml, where the action is the latest release.
# - Every other job is marked `local-only` (it tests something added after the latest
#   release) and stays here. Add a job there for every new input or output.
# - Values go through `env:`, never interpolated in `run:`.

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # What the latest release does: a smoke test of the stable contract.
  stable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Test minimal pyproject.toml
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify minimal pyproject.toml
        env:
          NAME: ${{ steps.test-minimal.outputs.name }}
          VERSION: ${{ steps.test-minimal.outputs.version }}
          EXTRAS: ${{ steps.test-minimal.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "version" "0.1.0" "$VERSION"
          assert_equal "extras" "[]" "$EXTRAS"
          print_success "minimal pyproject.toml test passed"

      - name: 🧪 Test pyproject.toml with extras
        id: test-extras
        uses: ./
        with:
          pyproject-path: test-data/with-extras/pyproject.toml

      - name: ✓ Verify extras
        env:
          NAME: ${{ steps.test-extras.outputs.name }}
          VERSION: ${{ steps.test-extras.outputs.version }}
          EXTRAS: ${{ steps.test-extras.outputs.extras }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "coola" "$NAME"
          assert_equal "version" "1.2.3" "$VERSION"
          assert_equal "extras" '["numpy","pandas"]' "$EXTRAS"
          print_success "extras test passed"

      - name: 🧪 Test missing version (should fail)
        id: test-missing-version
        uses: ./
        with:
          pyproject-path: test-data/missing-version/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify a missing version fails the step
        env:
          OUTCOME: ${{ steps.test-missing-version.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "a missing version fails the step"

  # The list of the cases is the list of the directories of test-data/ with an expected.json.
  cases:
    # local-only
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      cases: ${{ steps.list.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: List the cases
        id: list
        run: |
          cases="$(for file in test-data/*/expected.json; do basename "$(dirname "$file")"; done | jq -R . | jq -sc .)"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  # Each case runs the action with the inputs of its inputs.json (the other inputs have their
  # default, repeated here: tests/integration/test_workflows.py checks them against action.yaml)
  # and compares the json output with its expected.json. tests/integration/test_golden.py
  # checks the same files without GitHub.
  golden:
    # local-only
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the inputs of the case
        id: case
        env:
          CASE: ${{ matrix.case }}
        run: |
          file="test-data/$CASE/inputs.json"
          if [ -f "$file" ]; then inputs="$(jq -c . "$file")"; else inputs='{}'; fi
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run the action on the case
        id: action
        uses: ./
        with:
          pyproject-path: ${{ fromJSON(steps.case.outputs.inputs)['pyproject-path'] || format('test-data/{0}/pyproject.toml', matrix.case) }}
          extra-values: ${{ fromJSON(steps.case.outputs.inputs)['extra-values'] || '[]' }}
          dependencies: ${{ fromJSON(steps.case.outputs.inputs)['dependencies'] || '[]' }}
          python-candidates: ${{ fromJSON(steps.case.outputs.inputs)['python-candidates'] || '["3.11","3.12","3.13","3.14","3.15"]' }}
          fail-on-missing: ${{ fromJSON(steps.case.outputs.inputs)['fail-on-missing'] || 'false' }}
          fail-on-dynamic-version: ${{ fromJSON(steps.case.outputs.inputs)['fail-on-dynamic-version'] || 'false' }}
          strict: ${{ fromJSON(steps.case.outputs.inputs)['strict'] || 'false' }}
          step-summary: ${{ fromJSON(steps.case.outputs.inputs)['step-summary'] || 'false' }}
          resolve-dynamic-version: ${{ fromJSON(steps.case.outputs.inputs)['resolve-dynamic-version'] || 'false' }}

      - name: ✓ Compare the json output with the golden file
        env:
          EXPECTED: test-data/${{ matrix.case }}/expected.json
          ACTUAL: ${{ steps.action.outputs.json }}
        run: python scripts/compare_json.py "$EXPECTED" "$ACTUAL"

  # What the golden files cannot see: failures, strict, and what the action leaves behind.
  wiring:
    # local-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Test a successful run
        id: test-minimal
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Compare the json output with the golden file
        env:
          EXPECTED: test-data/minimal/expected.json
          ACTUAL: ${{ steps.test-minimal.outputs.json }}
        run: python scripts/compare_json.py "$EXPECTED" "$ACTUAL"

      - name: 🧪 Test a missing file (should fail)
        id: test-missing-file
        uses: ./
        with:
          pyproject-path: test-data/does-not-exist/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify Test a missing file fails the step
        env:
          OUTCOME: ${{ steps.test-missing-file.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test a missing file fails the step"

      - name: 🧪 Test an invalid extra-values (should fail)
        id: test-invalid-input
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          extra-values: "not json"
        continue-on-error: true

      - name: ✓ Verify Test an invalid extra-values fails the step
        env:
          OUTCOME: ${{ steps.test-invalid-input.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test an invalid extra-values fails the step"

      - name: 🧪 Test strict with a warning (should fail)
        id: test-strict
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml
          strict: "true"
        continue-on-error: true

      - name: ✓ Verify Test strict with a warning fails the step
        env:
          OUTCOME: ${{ steps.test-strict.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test strict with a warning fails the step"

      - name: 🧪 Test the same file without strict
        id: test-not-strict
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml

      - name: ✓ Verify a warning does not fail the step without strict
        env:
          OUTCOME: ${{ steps.test-not-strict.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "success" "$OUTCOME"
          print_success "a warning does not fail the step without strict"

      - name: 🧪 Test fail-on-missing with a missing dependency (should fail)
        id: test-fail-on-missing
        uses: ./
        with:
          pyproject-path: test-data/with-dependencies/pyproject.toml
          dependencies: '["invoke-tasklib","missing"]'
          fail-on-missing: "true"
        continue-on-error: true

      - name: ✓ Verify Test fail-on-missing with a missing dependency fails the step
        env:
          OUTCOME: ${{ steps.test-fail-on-missing.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test fail-on-missing with a missing dependency fails the step"

      - name: 🧪 Test a dynamic version that cannot be resolved (should fail)
        id: test-unresolved
        uses: ./
        with:
          pyproject-path: test-data/dynamic-version/pyproject.toml
          resolve-dynamic-version: "true"
          fail-on-dynamic-version: "true"
        continue-on-error: true

      - name: ✓ Verify Test a dynamic version that cannot be resolved fails the step
        env:
          OUTCOME: ${{ steps.test-unresolved.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Test a dynamic version that cannot be resolved fails the step"

      - name: ✓ Verify the action leaves nothing behind
        run: |
          source scripts/test-helper.sh
          assert_equal "__pycache__ directories" "0" "$(count_pycache)"
          assert_equal "venvs left" "0" "$(count_venvs)"
          print_success "nothing left behind"

  # Windows runners are not supported: the action must fail with an explicit error
  test-windows:
    # local-only
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: 🧪 Test the action on Windows (should fail)
        id: test-windows
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify the action fails on Windows
        shell: bash
        env:
          OUTCOME: ${{ steps.test-windows.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Windows correctly rejected"

  # The action installs "packaging" in a private venv when the Python on PATH lacks
  # it. setup-python's Python has no "packaging" module, but the job removes it
  # anyway so that the test does not depend on the runner image.
  test-bootstrap:
    # local-only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Remove packaging from the Python on PATH
        run: |
          source scripts/test-helper.sh
          python -m pip uninstall --yes packaging || true
          if python -c "import packaging" 2> /dev/null; then
            print_error "packaging should not be importable"
            exit 1
          fi
          assert_equal "venvs" "0" "$(count_venvs)"

      # packaging is missing and cannot be installed: the step fails
      - name: 🧪 Test without packaging and without index (should fail)
        id: test-no-index
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        env:
          PIP_NO_INDEX: "1"
        continue-on-error: true

      - name: ✓ Verify the step fails when packaging cannot be installed
        env:
          OUTCOME: ${{ steps.test-no-index.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          assert_equal "venvs left" "0" "$(count_venvs)"
          print_success "missing packaging correctly failed"

      # packaging is missing: it is installed in a private venv, removed afterwards
      - name: 🧪 Test without packaging
        id: test-no-packaging
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify packaging is installed in a private venv
        env:
          NAME: ${{ steps.test-no-packaging.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          if python -c "import packaging" 2> /dev/null; then
            print_error "the Python on PATH must not be modified"
            exit 1
          fi
          assert_equal "venvs left" "0" "$(count_venvs)"
          print_success "bootstrap test passed"

      # packaging is available: the Python on PATH is used
      - name: Install packaging in the Python on PATH
        run: python -m pip install --quiet packaging

      - name: 🧪 Test with packaging
        id: test-packaging
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml

      - name: ✓ Verify the action works when packaging is available
        env:
          NAME: ${{ steps.test-packaging.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          print_success "packaging available test passed"

  # The installer input chooses the tool that installs "packaging" in the private venv.
  test-installer:
    # local-only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Remove packaging from the Python on PATH
        run: |
          source scripts/test-helper.sh
          python -m pip uninstall --yes packaging || true
          if python -c "import packaging" 2> /dev/null; then
            print_error "packaging should not be importable"
            exit 1
          fi

      - name: 🧪 Test an invalid installer (should fail)
        id: test-invalid-installer
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          installer: conda
        continue-on-error: true

      - name: ✓ Verify an invalid installer fails
        env:
          OUTCOME: ${{ steps.test-invalid-installer.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "an invalid installer fails"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: 🧪 Test the uv installer
        id: test-uv
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          installer: uv

      - name: ✓ Verify packaging is installed with uv
        env:
          NAME: ${{ steps.test-uv.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          if python -c "import packaging" 2> /dev/null; then
            print_error "the Python on PATH must not be modified"
            exit 1
          fi
          assert_equal "venvs left" "0" "$(count_venvs)"
          print_success "uv installer test passed"

      - name: 🧪 Test the auto installer
        id: test-auto
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
          installer: auto

      - name: ✓ Verify packaging is installed with the auto installer
        env:
          NAME: ${{ steps.test-auto.outputs.name }}
        run: |
          source scripts/test-helper.sh
          assert_equal "name" "minimal-pkg" "$NAME"
          assert_equal "venvs left" "0" "$(count_venvs)"
          print_success "auto installer test passed"

  # Only Python 3.11 or later is supported: the action must fail with an explicit error
  test-old-python:
    # local-only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 🧪 Test the action with Python 3.10 (should fail)
        id: test-old-python
        uses: ./
        with:
          pyproject-path: test-data/minimal/pyproject.toml
        continue-on-error: true

      - name: ✓ Verify Python 3.10 is rejected
        env:
          OUTCOME: ${{ steps.test-old-python.outcome }}
        run: |
          source scripts/test-helper.sh
          assert_equal "outcome" "failure" "$OUTCOME"
          print_success "Python 3.10 is rejected"
