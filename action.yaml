# Composite action shared by every workflow that needs package metadata from
# pyproject.toml (build.yaml, test-package-extras.yaml, nightly-package.yaml,
# test-deps.yaml). Reads the project name, version, and the optional-extras
# names directly from pyproject.toml's [project] and
# [project.optional-dependencies] tables instead of a hardcoded/duplicated
# list, so it can never drift from what `pip install "coola[extra]"` actually
# installs. Requires the repository to already be checked out and a Python 3
# interpreter to be available on PATH; on Python < 3.11 (no stdlib tomllib)
# it installs the "tomli" backport on the fly.

name: Extract pyproject metadata
description: Read the project name, version, and optional-dependency extra names from pyproject.toml

inputs:
  pyproject-path:
    description: Path to pyproject.toml
    required: false
    default: pyproject.toml
  extra-values:
    description: >
      JSON array of additional values to prepend to the extras read from
      pyproject.toml, for callers that need a non-package value in the list
      too (e.g. '[""]' for a "no extra" baseline, or '["all"]').
    required: false
    default: "[]"
  dependencies:
    description: >
      JSON array of package names whose version specifier is looked up in
      [project].dependencies, [project.optional-dependencies] and
      [dependency-groups] (e.g. '["invoke-tasklib"]').
    required: false
    default: "[]"

outputs:
  name:
    description: Project name, as declared in [project].name
    value: ${{ steps.metadata.outputs.name }}
  version:
    description: Project version, as declared in [project].version
    value: ${{ steps.metadata.outputs.version }}
  extras:
    description: JSON array of extra names
    value: ${{ steps.metadata.outputs.extras }}
  dependency-specifiers:
    description: >
      JSON object mapping each requested package to its specifier (null if
      not found, empty string if it has no specifier)
    value: ${{ steps.metadata.outputs.dependency-specifiers }}

runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      env:
        PYPROJECT_PATH: ${{ inputs.pyproject-path }}
        EXTRA_VALUES: ${{ inputs.extra-values }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        set -euo pipefail
        python3 -c "import tomllib" 2>/dev/null || python3 -c "import tomli" 2>/dev/null || pip install --quiet --disable-pip-version-check tomli
        python3 -c "import packaging" 2>/dev/null || pip install --quiet --disable-pip-version-check packaging
        metadata=$(python3 "$GITHUB_ACTION_PATH/scripts/extract_metadata.py" "$PYPROJECT_PATH" "$EXTRA_VALUES" "$DEPENDENCIES")

        name=$(jq -r '.name' <<< "$metadata")
        version=$(jq -r '.version' <<< "$metadata")
        extras=$(jq -c '.extras' <<< "$metadata")
        dependency_specifiers=$(jq -c '.dependency_specifiers' <<< "$metadata")

        # Workflow commands are only parsed on stdout; escape them like
        # @actions/core does so a message cannot span several commands.
        jq -r '.warnings[] | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | "::warning::" + .' <<< "$metadata"

        echo "📦 name=$name version=$version extras=$extras"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "extras=$extras" >> "$GITHUB_OUTPUT"
        echo "dependency-specifiers=$dependency_specifiers" >> "$GITHUB_OUTPUT"
