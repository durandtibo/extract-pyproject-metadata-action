# Composite action that reads project metadata from a pyproject.toml: the
# project name and version, the names of the optional-dependency extras, and
# the version specifiers of selected dependencies. Reading them from the file
# instead of a hardcoded or duplicated list keeps workflows (build, test
# matrices, publish steps, ...) from drifting out of sync with what
# `pip install` actually installs.
#
# The logic lives in scripts/extract_metadata.py, started by scripts/run.sh
# (which installs its requirements if needed); this file only wires the inputs
# to the scripts and their output to the action outputs. Requires the
# repository to already be checked out and a Python 3.11+ interpreter to be
# available on PATH (python3, or the python-executable input). If "packaging"
# is missing, it is installed in a private virtual environment.
#
# Only Linux and macOS runners are supported. On a Windows runner the step
# fails with an explicit error (the step expects python3 and a POSIX bash).

name: Extract pyproject metadata
description: Read the project name, version, optional-dependency extra names, and dependency version specifiers from pyproject.toml

inputs:
  pyproject-path:
    description: Path to pyproject.toml
    required: false
    default: pyproject.toml
  extra-values:
    description: >
      JSON array of additional values to prepend to the extras read from
      pyproject.toml, for callers that need a non-package value in the list
      too (e.g. '[""]' for a "no extra" baseline, or '["all"]').
    required: false
    default: "[]"
  dependencies:
    description: >
      JSON array of package names whose version specifier is looked up in
      [project].dependencies, [project.optional-dependencies] and
      [dependency-groups] (e.g. '["invoke-tasklib"]'). A name followed by "@"
      and "project", "extra:<name>" or "group:<name>" is looked up there only
      (e.g. '["pytest@group:dev"]').
    required: false
    default: "[]"
  fail-on-missing:
    description: >
      Set to "true" to fail when a package listed in dependencies is not found,
      instead of reporting it as null in dependency-specifiers ("true" or
      "false"; the case and surrounding spaces are ignored)
    required: false
    default: "false"

  python-candidates:
    description: >
      JSON array of "major.minor" Python versions to choose from for the
      python-versions output (e.g. '["3.11","3.12"]')
    required: false
    default: '["3.10","3.11","3.12","3.13","3.14"]'

  fail-on-dynamic-version:
    description: >
      Set to "true" to fail when the version is listed in [project].dynamic,
      instead of reporting an empty version with a warning ("true" or "false";
      the case and surrounding spaces are ignored)
    required: false
    default: "false"

  strict:
    description: >
      Set to "true" to fail when there is any warning, instead of only
      reporting it ("true" or "false"; the case and surrounding spaces are
      ignored)
    required: false
    default: "false"
  python-executable:
    description: >
      Python interpreter that runs the action, a command found on PATH or a
      path (it must be Python 3.11 or later), for runners where python3 is not
      the interpreter to use
    required: false
    default: python3
  step-summary:
    description: >
      Set to "true" to also write the outputs and the warnings to the job
      summary of the workflow run ("true" or "false"; the case and surrounding
      spaces are ignored)
    required: false
    default: "false"

outputs:
  name:
    description: Project name, as declared in [project].name
    value: ${{ steps.metadata.outputs.name }}
  normalized-name:
    description: >
      Project name normalized per PEP 503 (lowercase, with each run of "-", "_"
      and "." replaced by a single "-")
    value: ${{ steps.metadata.outputs.normalized-name }}
  version:
    description: Project version, as declared in [project].version
    value: ${{ steps.metadata.outputs.version }}
  normalized-version:
    description: >
      Project version in the canonical form of PEP 440 (e.g. "1.0rc1" for
      "1.0-RC1"; empty if the version is dynamic)
    value: ${{ steps.metadata.outputs.normalized-version }}
  description:
    description: >
      Project description, as declared in [project].description (empty if not
      declared)
    value: ${{ steps.metadata.outputs.description }}
  readme:
    description: >
      Path of the readme file, from [project].readme (a string, or the file of a
      table); empty if not declared or inline
    value: ${{ steps.metadata.outputs.readme }}
  license:
    description: >
      License, from [project].license (an SPDX expression, or the text of the
      table); empty if not declared or a file
    value: ${{ steps.metadata.outputs.license }}
  authors:
    description: >
      JSON array of the authors of [project].authors, each an object with the
      name and the email it has ("[]" if none)
    value: ${{ steps.metadata.outputs.authors }}
  urls:
    description: >
      JSON object mapping each label of [project.urls] to its URL ("{}" if
      none)
    value: ${{ steps.metadata.outputs.urls }}
  requires-python:
    description: >
      Python version specifier, as declared in [project].requires-python (empty
      if not declared)
    value: ${{ steps.metadata.outputs.requires-python }}
  python-versions:
    description: >
      JSON array of the python-candidates allowed by requires-python (all of
      them if requires-python is not declared)
    value: ${{ steps.metadata.outputs.python-versions }}
  python-min:
    description: >
      Lowest of the python-versions, compared as numbers (empty if there is
      none)
    value: ${{ steps.metadata.outputs.python-min }}
  python-max:
    description: >
      Highest of the python-versions, compared as numbers (empty if there is
      none)
    value: ${{ steps.metadata.outputs.python-max }}
  python-matrix:
    description: >
      JSON object {"python-version": python-versions}, to use as a job matrix
      with fromJSON
    value: ${{ steps.metadata.outputs.python-matrix }}
  extras:
    description: JSON array of extra names
    value: ${{ steps.metadata.outputs.extras }}
  groups:
    description: JSON array of dependency group names, from [dependency-groups]
    value: ${{ steps.metadata.outputs.groups }}
  project-dependencies:
    description: >
      JSON object mapping each package of [project].dependencies to its
      specifier (empty string if it has none)
    value: ${{ steps.metadata.outputs.project-dependencies }}
  dependency-specifiers:
    description: >
      JSON object mapping each requested package to its specifier (null if
      not found, empty string if it has no specifier)
    value: ${{ steps.metadata.outputs.dependency-specifiers }}
  dependency-requirements:
    description: >
      JSON object mapping each requested package to the array of all its
      requirements, in search order, each an object with its specifier and its
      environment marker (empty strings if it has none); an empty array if the
      package is not found
    value: ${{ steps.metadata.outputs.dependency-requirements }}

runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      env:
        PYPROJECT_PATH: ${{ inputs.pyproject-path }}
        EXTRA_VALUES: ${{ inputs.extra-values }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        PYTHON_CANDIDATES: ${{ inputs.python-candidates }}
        FAIL_ON_DYNAMIC_VERSION: ${{ inputs.fail-on-dynamic-version }}
        STRICT: ${{ inputs.strict }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
        PYTHON_EXECUTABLE: ${{ inputs.python-executable }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run.sh" \
          --github-output "$GITHUB_OUTPUT" \
          --fail-on-missing "$FAIL_ON_MISSING" \
          --python-candidates "$PYTHON_CANDIDATES" \
          --fail-on-dynamic-version "$FAIL_ON_DYNAMIC_VERSION" \
          --strict "$STRICT" \
          --step-summary "$STEP_SUMMARY" \
          -- "$PYPROJECT_PATH" "$EXTRA_VALUES" "$DEPENDENCIES"
